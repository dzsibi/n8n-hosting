name: Release Helm chart

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: "3.17.0"

      - name: Lint and package
        id: package
        run: |
          VERSION="$(helm show chart charts/n8n | awk '$1 == "version:" { print $2 }')"
          helm lint charts/n8n
          mkdir -p dist
          helm package charts/n8n --destination dist
          echo "file=dist/n8n-${VERSION}.tgz" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: |
          echo "${{ github.token }}" | \
            helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish chart
        run: |
          helm push "${{ steps.package.outputs.file }}" \
            "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/n8n-helm-chart"
